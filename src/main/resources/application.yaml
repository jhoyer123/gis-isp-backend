spring:
  application:
    name: gis-isp

  # ─── BASE DE DATOS ───────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username:  ${DB_USERNAME}
    password:  ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ─── JPA / HIBERNATE ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ─── FLAYWAY ─────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# ─── Jwt ─────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000 # 30 minutos en milisegundos
  refresh-expiration: 1209600000  # 14 días (refresh token)