spring:
  application:
    name: gis-isp

  # ─── BASE DE DATOS ───────────────────────────────────────
  datasource:
    url: ${DB_URL}
    username:  ${DB_USERNAME}
    password:  ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ─── JPA / HIBERNATE ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ─── FLAYWAY ─────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# ─── JWT ────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 1 hora en milisegundos
  refresh-expiration: 604800000  # 7 días (refresh token)

server:
  forward-headers-strategy: framework

# ─── SECURITY ────────────────────────────────────
security:
  login:
    max-attempts: 5
    lock-duration: PT15M