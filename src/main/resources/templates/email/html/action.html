<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Veranet GIS</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:10px;padding:32px;max-width:480px;width:100%;">
                <tr>
                    <td style="font-size:18px;font-weight:bold;color:#171717;padding-bottom:16px;">
                        Veranet GIS
                    </td>
                </tr>
                <tr>
                    <td style="font-size:20px;font-weight:bold;color:#171717;padding-bottom:12px;"
                        th:text="${title}">Título
                    </td>
                </tr>
                <tr>
                    <td style="font-size:15px;line-height:22px;color:#404040;padding-bottom:8px;"
                        th:text="'Hola ' + ${name} + ','">Hola,
                    </td>
                </tr>
                <tr>
                    <td style="font-size:15px;line-height:22px;color:#404040;padding-bottom:24px;"
                        th:text="${message}">Mensaje
                    </td>
                </tr>
                <tr>
                    <td style="padding-bottom:24px;">
                        <a th:href="${actionUrl}" href="#"
                           style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;
                                  padding:12px 24px;border-radius:8px;font-size:15px;font-weight:bold;"
                           th:text="${buttonLabel}">Acción</a>
                    </td>
                </tr>
                <tr>
                    <td style="font-size:13px;line-height:20px;color:#737373;padding-bottom:8px;"
                        th:text="'Este enlace vence en ' + ${expiresIn} + '.'">Vence pronto.
                    </td>
                </tr>
                <tr>
                    <td style="font-size:12px;line-height:18px;color:#a3a3a3;word-break:break-all;">
                        Si el botón no funciona, copia este enlace en tu navegador:<br>
                        <span th:text="${actionUrl}">https://...</span>
                    </td>
                </tr>
                <tr>
                    <td style="font-size:12px;color:#a3a3a3;padding-top:20px;border-top:1px solid #e5e5e5;">
                        Si no solicitaste esto, ignora este correo.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
